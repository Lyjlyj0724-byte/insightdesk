name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    strategy:
      fail-fast: false  # 一个系统挂了不取消另一个，信息更全
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev deps
        run: python -m pip install -e ".[dev]"

      # lint 放在测试前面：跑得快，低级错误 30 秒内就反馈
      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v
